<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="description"
      content="T-shirt order form for customer confirmation and product selection."
    />
    <title>T-Shirt Order Form - Product Pick</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body>
    <header>
      <h1>Product Pick</h1>
    </header>
    <main>
      <form>
        <fieldset>
          <legend>Contact Information</legend>
          <div>
            <label for="full-name">Full Name:</label>
            <input
              type="text"
              id="full-name"
              name="full-name"
              minlength="2"
              required
            />
          </div>

          <div>
            <label for="email">Email Address:</label>
            <input type="email" id="email" name="email" required />
          </div>
        </fieldset>

        <br />

        <fieldset>
          <legend>Pick a Colour:</legend>
          <div>
            <input type="radio" id="red" name="colour" value="red" required />
            <label for="red">Red</label>
          </div>
          <div>
            <input type="radio" id="blue" name="colour" value="blue" />
            <label for="blue">Blue</label>
          </div>
          <div>
            <input type="radio" id="green" name="colour" value="green" />
            <label for="green">Green</label>
          </div>
        </fieldset>

        <br />

        <fieldset>
          <legend>Product Size</legend>
          <div>
            <label for="size">Size:</label>
            <select id="size" name="size" required>
              <option value="">--Select a size--</option>
              <option value="xs">XS</option>
              <option value="s">S</option>
              <option value="m">M</option>
              <option value="l">L</option>
              <option value="xl">XL</option>
              <option value="xxl">XXL</option>
            </select>
          </div>
        </fieldset>

        <br />
        <button type="submit">Submit Order</button>
      </form>
    </main>
    <footer>
      <p>By MEYSAM RAZAGH</p>
    </footer>
  </body>
</html>
